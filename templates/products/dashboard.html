<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Product Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Product Management
        </a>

        <div class="d-flex align-items-center">

            <span class="text-white me-3">
                Welcome, {{ user.username }}
            </span>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-outline-light btn-sm"
                >
                    Logout
                </button>
            </form>

        </div>

    </div>

</nav>


<div class="container py-5">

    <h1>Dashboard</h1>

    <p class="text-muted">
        Product management overview
    </p>


    <div class="row g-4 mt-2">

        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h6 class="text-muted">
                        Total Products
                    </h6>

                    <h2>{{ total_products }}</h2>
                </div>
            </div>
        </div>


        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h6 class="text-muted">
                        Active Products
                    </h6>

                    <h2>{{ active_products }}</h2>
                </div>
            </div>
        </div>


        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h6 class="text-muted">
                        Inactive Products
                    </h6>

                    <h2>{{ inactive_products }}</h2>
                </div>
            </div>
        </div>


        <div class="col-md-6 col-lg-3">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h6 class="text-muted">
                        Low Stock Products
                    </h6>

                    <h2>0</h2>
                </div>
            </div>
        </div>

    </div>


    <div class="mt-5">

        <a 
           href="{% url 'product_list' %}"
           class="btn btn-primary me-2"
        >
            Products
        </a>

        <a 
            href="{% url 'product_add' %}"
            class="btn btn-success"
        >
            Add Product
        </a>

    </div>

</div>

</body>
</html>
